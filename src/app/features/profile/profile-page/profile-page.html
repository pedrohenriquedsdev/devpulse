@if (user(); as u) {
  <article class="profile-card">
    <img class="avatar" [src]="u.avatar_url" [alt]="u.login" />

    <div class="identity">
      <h1 class="display-name">{{ u.name ?? u.login }}</h1>
      <p class="login">&#64;{{ u.login }}</p>
      <p class="bio">{{ u.bio ?? 'Sem biografia.' }}</p>
    </div>

    <dl class="stats">
      <div class="stat">
        <dt><i class="bi bi-book"></i> Repositórios</dt>
        <dd>{{ u.public_repos }}</dd>
      </div>
      <div class="stat">
        <dt><i class="bi bi-people"></i> Seguidores</dt>
        <dd>{{ u.followers }}</dd>
      </div>
      <div class="stat">
        <dt><i class="bi bi-person-plus"></i> Seguindo</dt>
        <dd>{{ u.following }}</dd>
      </div>
    </dl>
  </article>
} @else {
  <p class="loading">Carregando perfil...</p>
}
